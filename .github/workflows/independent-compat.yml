name: Independent Compatibility
on: [push, pull_request, workflow_dispatch]

jobs:
  native-and-scenariomesh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Read workload size
        id: scale
        shell: bash
        run: echo "count=$(cat .fixture-scale)" >> "$GITHUB_OUTPUT"
      - name: Generate workload
        run: python3 scripts/generate_workload.py '${{ steps.scale.outputs.count }}'
      - name: Native Maven baseline
        run: |
          rm -rf target/independent-executions
          mvn -B -ntp test -Dui.browser.enabled=false | tee native.log
          python3 scripts/validate.py '${{ steps.scale.outputs.count }}'
      - name: Build ScenarioMesh independently
        uses: actions/checkout@v4
        with:
          repository: ritikrikm/ScenarioMesh
          ref: agent/mvp-runtime
          path: ScenarioMesh
      - name: Install ScenarioMesh
        working-directory: ScenarioMesh
        run: mvn -B -ntp clean install
      - name: Inject ScenarioMesh activation only now
        run: |
          mkdir -p .mvn
          cat > .mvn/extensions.xml <<'XML'
          <extensions>
            <extension>
              <groupId>io.scenariomesh</groupId>
              <artifactId>scenariomesh-maven-extension</artifactId>
              <version>0.1.0-SNAPSHOT</version>
            </extension>
          </extensions>
          XML
          cat > scenariomesh.yml <<'YAML'
          scenariomesh:
            configVersion: 1
            workers:
              count: 4
            reporting:
              directory: target/scenariomesh
          YAML
      - name: Same Maven command under ScenarioMesh
        run: |
          rm -rf target/independent-executions target/scenariomesh
          mvn -B -ntp test -Dui.browser.enabled=false | tee scenariomesh.log
      - name: Validate ScenarioMesh result without reshaping target
        run: |
          grep -F 'ScenarioMesh: takeover enabled for enterprise-ui-regression-fixture' scenariomesh.log
          grep -F 'ScenarioMesh selected adapter: junit-platform' scenariomesh.log
          python3 scripts/validate.py '${{ steps.scale.outputs.count }}'
          test -f target/scenariomesh/summary.json
          test -f target/scenariomesh/report.html
