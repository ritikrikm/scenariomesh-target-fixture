name: ScenarioMesh External Target E2E

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Number of executable Cucumber scenarios
        required: true
        default: '100'
      workers:
        description: ScenarioMesh worker count
        required: true
        default: '4'
      browser:
        description: Use real headless Chrome workload
        type: boolean
        required: true
        default: true
      scenariomesh_ref:
        description: ScenarioMesh git ref to build
        required: true
        default: 'agent/worker-hardening-test'

concurrency:
  group: target-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SCENARIOMESH_REF: ${{ github.event.inputs.scenariomesh_ref || 'agent/worker-hardening-test' }}

jobs:
  fixture-baseline:
    name: Baseline / normal Maven / 4 scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Disable ScenarioMesh only for baseline
        run: mv .mvn/extensions.xml .mvn/extensions.xml.disabled
      - name: Generate baseline rows
        run: python3 scripts/generate_scenarios.py 4
      - name: Create native Cucumber suite for baseline only
        run: |
          cat > src/test/java/io/scenariomesh/fixture/RunCucumberTest.java <<'JAVA'
          package io.scenariomesh.fixture;

          import org.junit.platform.suite.api.ConfigurationParameter;
          import org.junit.platform.suite.api.IncludeEngines;
          import org.junit.platform.suite.api.SelectClasspathResource;
          import org.junit.platform.suite.api.Suite;

          import static io.cucumber.junit.platform.engine.Constants.GLUE_PROPERTY_NAME;

          @Suite
          @IncludeEngines("cucumber")
          @SelectClasspathResource("features")
          @ConfigurationParameter(key = GLUE_PROPERTY_NAME, value = "io.scenariomesh.fixture")
          public class RunCucumberTest {
          }
          JAVA
      - name: Run normal Maven/Surefire baseline
        run: |
          rm -rf target/fixture-executions
          mvn -B -ntp test | tee baseline-maven.log
      - name: Validate baseline exact-once execution
        run: python3 scripts/validate_execution.py 4
      - name: Confirm ScenarioMesh did not own baseline
        run: '! grep -q "ScenarioMesh: takeover enabled" baseline-maven.log'

  scenariomesh-smoke:
    name: ScenarioMesh / ${{ matrix.scenarios }} scenarios / ${{ matrix.workers }} workers
    needs: fixture-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenarios: 4
            workers: 1
            browserMode: chrome-headless
          - scenarios: 4
            workers: 4
            browserMode: chrome-headless
          - scenarios: 100
            workers: 4
            browserMode: none
    steps:
      - name: Checkout target fixture
        uses: actions/checkout@v4
        with:
          path: target-fixture
      - name: Checkout ScenarioMesh advanced branch
        uses: actions/checkout@v4
        with:
          repository: ritikrikm/ScenarioMesh
          ref: ${{ env.SCENARIOMESH_REF }}
          path: ScenarioMesh
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and install ScenarioMesh
        working-directory: ScenarioMesh
        run: mvn -B -ntp clean install
      - name: Generate target scenarios
        working-directory: target-fixture
        run: python3 scripts/generate_scenarios.py '${{ matrix.scenarios }}'
      - name: Configure worker count
        working-directory: target-fixture
        run: python3 scripts/set_workers.py '${{ matrix.workers }}'
      - name: Run the target repo with its normal command
        working-directory: target-fixture
        run: |
          rm -rf target/fixture-executions target/scenariomesh
          mkdir -p target
          mvn -B -ntp test -Dfixture.browser.mode='${{ matrix.browserMode }}' | tee target/scenariomesh-maven.log
      - name: Prove ScenarioMesh took ownership
        working-directory: target-fixture
        run: grep -F 'ScenarioMesh: takeover enabled for scenariomesh-target-fixture' target/scenariomesh-maven.log
      - name: Validate exact-once execution
        working-directory: target-fixture
        run: python3 scripts/validate_execution.py '${{ matrix.scenarios }}'
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenariomesh-target-${{ matrix.scenarios }}-w${{ matrix.workers }}
          path: |
            target-fixture/target/scenariomesh-maven.log
            target-fixture/target/fixture-executions/**
            target-fixture/target/scenariomesh/**
            target-fixture/target/cucumber.json
            target-fixture/target/surefire-reports/**
          if-no-files-found: warn

  crash-recovery:
    name: Worker crash / requeue / exact-once
    needs: scenariomesh-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: target-fixture
      - uses: actions/checkout@v4
        with:
          repository: ritikrikm/ScenarioMesh
          ref: ${{ env.SCENARIOMESH_REF }}
          path: ScenarioMesh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build ScenarioMesh
        working-directory: ScenarioMesh
        run: mvn -B -ntp clean install
      - name: Prepare crash workload
        working-directory: target-fixture
        run: |
          python3 scripts/generate_scenarios.py 20
          python3 scripts/set_workers.py 4
          rm -rf target/fixture-executions target/fixture-crash-sentinels target/scenariomesh
      - name: Kill one worker once during a scenario
        working-directory: target-fixture
        run: |
          mkdir -p target
          mvn -B -ntp test \
            -Dfixture.browser.mode=none \
            -Dfixture.crash.once.id=scenario-00007 \
            | tee target/scenariomesh-maven.log
      - name: Prove takeover and retry/replacement
        working-directory: target-fixture
        run: |
          grep -F 'ScenarioMesh: takeover enabled for scenariomesh-target-fixture' target/scenariomesh-maven.log
          grep -E 'RETRY .*scenario-00007|REPLACED .*retryable' target/scenariomesh-maven.log
          test -f target/fixture-crash-sentinels/scenario-00007.crashed-once
      - name: Validate all scenarios exactly once after recovery
        working-directory: target-fixture
        run: python3 scripts/validate_execution.py 20
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-crash-recovery
          path: |
            target-fixture/target/scenariomesh-maven.log
            target-fixture/target/fixture-executions/**
            target-fixture/target/fixture-crash-sentinels/**
            target-fixture/target/scenariomesh/**
          if-no-files-found: warn

  manual:
    if: github.event_name == 'workflow_dispatch'
    name: Manual / requested scale
    needs: fixture-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: target-fixture
      - uses: actions/checkout@v4
        with:
          repository: ritikrikm/ScenarioMesh
          ref: ${{ env.SCENARIOMESH_REF }}
          path: ScenarioMesh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build ScenarioMesh
        working-directory: ScenarioMesh
        run: mvn -B -ntp clean install
      - name: Prepare requested workload
        working-directory: target-fixture
        run: |
          python3 scripts/generate_scenarios.py '${{ inputs.scenarios }}'
          python3 scripts/set_workers.py '${{ inputs.workers }}'
      - name: Run target with ScenarioMesh
        working-directory: target-fixture
        env:
          FIXTURE_BROWSER_ENABLED: ${{ inputs.browser }}
        run: |
          rm -rf target/fixture-executions target/scenariomesh
          mkdir -p target
          if [ "$FIXTURE_BROWSER_ENABLED" = "true" ]; then
            FIXTURE_BROWSER_MODE=chrome-headless
          else
            FIXTURE_BROWSER_MODE=none
          fi
          mvn -B -ntp test -Dfixture.browser.mode="$FIXTURE_BROWSER_MODE" | tee target/scenariomesh-maven.log
      - name: Prove takeover
        working-directory: target-fixture
        run: grep -F 'ScenarioMesh: takeover enabled for scenariomesh-target-fixture' target/scenariomesh-maven.log
      - name: Validate exact-once
        working-directory: target-fixture
        run: python3 scripts/validate_execution.py '${{ inputs.scenarios }}'
