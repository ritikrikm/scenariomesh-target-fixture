name: ScenarioMesh Branch Scale

on:
  push:
  workflow_dispatch:

concurrency:
  group: branch-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout target fixture
        uses: actions/checkout@v4
        with:
          path: target-fixture
      - name: Read branch scale
        id: scale
        working-directory: target-fixture
        shell: bash
        run: |
          N="$(tr -d '[:space:]' < .fixture-scale)"
          test -n "$N"
          case "$N" in
            100) WORKERS=4; BROWSER=true ;;
            500) WORKERS=4; BROWSER=false ;;
            5000) WORKERS=8; BROWSER=false ;;
            *) echo "Unsupported branch scale: $N"; exit 1 ;;
          esac
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
      - name: Checkout ScenarioMesh advanced branch
        uses: actions/checkout@v4
        with:
          repository: ritikrikm/ScenarioMesh
          ref: agent/worker-hardening-test
          path: ScenarioMesh
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and install ScenarioMesh
        working-directory: ScenarioMesh
        run: mvn -B -ntp clean install
      - name: Generate branch workload
        working-directory: target-fixture
        run: |
          python3 scripts/generate_scenarios.py '${{ steps.scale.outputs.count }}'
          python3 scripts/set_workers.py '${{ steps.scale.outputs.workers }}'
      - name: Run normal target command under ScenarioMesh
        working-directory: target-fixture
        run: |
          rm -rf target/fixture-executions target/scenariomesh
          mkdir -p target
          mvn -B -ntp test -Dfixture.browser.enabled='${{ steps.scale.outputs.browser }}' | tee target/scenariomesh-maven.log
      - name: Validate ScenarioMesh ownership and totals
        working-directory: target-fixture
        shell: bash
        run: |
          N='${{ steps.scale.outputs.count }}'
          grep -F 'ScenarioMesh: takeover enabled for scenariomesh-target-fixture' target/scenariomesh-maven.log
          grep -F 'ScenarioMesh selected adapter: junit-platform' target/scenariomesh-maven.log
          grep -E "ScenarioMesh results: discovered=${N}, passed=${N}, skipped=0, failed=0" target/scenariomesh-maven.log
          test -f target/scenariomesh/report.html
          test -f target/scenariomesh/summary.json
          python3 scripts/validate_execution.py "$N"
      - name: Publish summary
        if: always()
        working-directory: target-fixture
        run: |
          echo "## ScenarioMesh branch-scale run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scenarios: ${{ steps.scale.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers: ${{ steps.scale.outputs.workers }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser: ${{ steps.scale.outputs.browser }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'ScenarioMesh results:|ScenarioMesh selected adapter:|ScenarioMesh: takeover enabled' target/scenariomesh-maven.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-scale-${{ steps.scale.outputs.count }}
          path: |
            target-fixture/target/scenariomesh-maven.log
            target-fixture/target/scenariomesh/**
            target-fixture/target/fixture-executions/**
          if-no-files-found: warn
